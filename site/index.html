<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>유택범 / Taekbeom Yoo - CV</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; height: 100%; background: #525659; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .toolbar {
      position: fixed; top: 0; left: 0; right: 0; height: 44px;
      background: #2b2d2f; color: #eee;
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 16px; font-size: 14px; z-index: 10;
    }
    .toolbar .tabs { display: flex; gap: 4px; }
    .toolbar .tab {
      padding: 4px 14px; border-radius: 6px; cursor: pointer;
      color: #aaa; background: transparent; border: none; font-size: 14px;
    }
    .toolbar .tab.active { color: #fff; background: #444; }
    .toolbar .tab:hover:not(.active) { color: #ddd; }
    .toolbar a { color: #9ecbff; text-decoration: none; font-size: 13px; }
    .toolbar a:hover { text-decoration: underline; }
    .pdf-wrap { position: absolute; top: 44px; bottom: 0; left: 0; right: 0; }
    embed { width: 100%; height: 100%; border: none; }
    .fallback { display: none; color: #eee; text-align: center; padding-top: 80px; font-size: 15px; }
    .fallback a { color: #9ecbff; }
    @media (max-width: 640px) {
      embed { display: none; }
      .fallback { display: block; }
    }
  </style>
</head>
<body>
  <div class="toolbar">
    <div class="tabs">
      <button class="tab active" onclick="switchLang('ko')">국문</button>
      <button class="tab" onclick="switchLang('en')">English</button>
    </div>
    <a id="download-link" href="cv_ko.pdf" download>PDF 다운로드</a>
  </div>
  <div class="pdf-wrap">
    <embed id="pdf-embed" src="cv_ko.pdf" type="application/pdf" />
  </div>
  <div class="fallback">
    <p>이 브라우저에서는 PDF 미리보기가 지원되지 않아요.</p>
    <p><a id="fallback-link" href="cv_ko.pdf">여기를 눌러 PDF를 여세요</a></p>
  </div>
  <script>
    function switchLang(lang) {
      const file = lang === 'ko' ? 'cv_ko.pdf' : 'cv_en.pdf';
      document.getElementById('pdf-embed').src = file;
      document.getElementById('download-link').href = file;
      document.getElementById('fallback-link').href = file;
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      event.target.classList.add('active');
    }
    // URL hash로 언어 지정 가능: index.html#en
    if (location.hash === '#en') switchLang('en');
  </script>
</body>
</html>
